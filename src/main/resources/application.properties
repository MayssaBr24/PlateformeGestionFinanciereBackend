# Nom de l'application
spring.application.name=gestionfinance

# Configuration MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/auth
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Configuration email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# Authentification DKIM (si disponible)
spring.mail.properties.mail.smtp.dkim.enable=true
spring.mail.properties.mail.smtp.dkim.selector=default
spring.mail.properties.mail.smtp.dkim.private-key=file:${DKIM_PRIVATE_KEY_PATH}

# Configuration du reverse DNS
spring.mail.properties.mail.smtp.localhost=yourdomain.com

# URL de base pour les emails
app.base-url=http://localhost:8080
spring.profiles.active=mysql

# Configuration de sécurité
spring.security.user.name=${SECURITY_USER_NAME}
spring.security.user.password=${SECURITY_USER_PASSWORD}
spring.security.user.roles=USER

app.email.sender-name=${APP_EMAIL_SENDER_NAME}

# Logs
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.enable=false

spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template=true
